# GitHub Actions CI/CD Pipeline
# 自動測試與部署腳本

name: CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    
    timeout-minutes: 10
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Use Node.js 20.x
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
    
    - name: Install dependencies
      run: npm ci
    
    - name: Install Playwright browsers (skip dependencies for speed)
      run: npx playwright install chromium
      timeout-minutes: 5
    
    - name: Run tests (exclude slow integration tests)
      run: node --test --experimental-test-coverage tests/*.test.js --test-concurrency=1
      timeout-minutes: 8
      env:
        NODE_OPTIONS: "--max-old-space-size=4096"
    
    - name: Validate registry
      run: node cli.js validate
    
    - name: Check MECE
      run: node scripts/check-mece.js
    
    - name: Build web
      run: npm run build
