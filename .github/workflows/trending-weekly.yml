name: Weekly Trending Star Discovery

on:
  schedule:
    - cron: '0 2 * * 1' # 每週一凌晨 02:00 UTC 自動執行
  workflow_dispatch: # 支援 GitHub Actions 介面手動觸發

permissions:
  contents: write

jobs:
  trending-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20'

      - name: Run Weekly Trending Discovery
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/trending-weekly.js

      - name: Validate Registry
        run: |
          npm install || true
          npm run validate

      - name: Build Web
        run: node scripts/build-web.js

      - name: Commit and Push if updated
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add registry/ dist/ core/
          if git diff --staged --quiet; then
            echo "No trending changes detected."
          else
            WEEK=$(node -e "const d=new Date();d.setUTCDate(d.getUTCDate()+4-(d.getUTCDay()||7));const y=new Date(Date.UTC(d.getUTCFullYear(),0,1));const w=Math.ceil(((d-y)/86400000+1)/7);console.log(d.getUTCFullYear()+'-W'+String(w).padStart(2,'0'))")
            git commit -m "feat(trending): auto-discover top GitHub trending tools for $WEEK [skip ci]"
            git push
          fi
