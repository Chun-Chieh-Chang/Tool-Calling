<!DOCTYPE html>
<html lang="zh-TW" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tool-Calling | AI Agent 工具檢索庫儀表板</title>
  <meta name="description" content="全自動工具調用效能外掛系統 - 擁有 280+ 頂尖開源 AI 代理技能與工具的檢索庫與儀表板">
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="alternate icon" href="favicon.ico">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <!-- Chart.js 統計圖表庫 -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
  <div class="background-effects">
    <div class="glow-orb orb-1"></div>
    <div class="glow-orb orb-2"></div>
  </div>

  <main class="container">
    <header class="header">
      <div class="logo-area">
        <h1>Tool-Calling <span>🔧⚡</span></h1>
        <p class="subtitle">全自動工具調用效能外掛系統與數據儀表板</p>
      </div>
    </header>

    <!-- 視圖切換頁籤 (Segmented Tabs) -->
    <div class="view-tabs-container">
      <div class="view-tabs">
        <button id="dashboardTabBtn" class="tab-btn active">
          <span>📊</span> 儀表板總覽
        </button>
        <button id="toolsTabBtn" class="tab-btn">
          <span>🔧</span> 工具目錄列表
        </button>
      </div>
    </div>

    <!-- 儀表板視圖 (Dashboard View) -->
    <div id="dashboardView">
      <!-- KPI 關鍵指標區塊 -->
      <div class="kpi-grid">
        <div class="kpi-card glass-panel">
          <div class="kpi-icon-wrapper">🛠️</div>
          <div class="kpi-content">
            <span class="kpi-value" id="kpiTotalTools">--</span>
            <span class="kpi-label">已註冊工具總數</span>
            <span class="kpi-subtext">已確效 100% 可用</span>
          </div>
        </div>

        <div class="kpi-card glass-panel">
          <div class="kpi-icon-wrapper">📁</div>
          <div class="kpi-content">
            <span class="kpi-value" id="kpiTotalCategories">--</span>
            <span class="kpi-label">領域分類總數</span>
            <span class="kpi-subtext">覆蓋完整開發場景</span>
          </div>
        </div>

        <div class="kpi-card glass-panel">
          <div class="kpi-icon-wrapper">⚡</div>
          <div class="kpi-content">
            <span class="kpi-value" id="kpiTotalSubtools">--</span>
            <span class="kpi-label">延伸子技能數</span>
            <span class="kpi-subtext">Monorepo 深層檢索</span>
          </div>
        </div>

        <div class="kpi-card glass-panel">
          <div class="kpi-icon-wrapper">🎯</div>
          <div class="kpi-content">
            <span class="kpi-value">L1 ~ L3</span>
            <span class="kpi-label">三層檢索引擎</span>
            <span class="kpi-subtext">精確 • 關鍵字 • 語義</span>
          </div>
        </div>
      </div>

      <!-- 統計圖表區塊 (Charts Layout) -->
      <div class="dashboard-charts-container">
        <div class="chart-card glass-panel">
          <div class="chart-header">
            <h3 class="chart-title">📊 各分類工具數量分佈</h3>
            <span class="chart-subtitle">點擊柱狀圖可直接篩選列表</span>
          </div>
          <div class="chart-wrapper">
            <canvas id="categoryChart"></canvas>
          </div>
        </div>

        <div class="chart-card glass-panel">
          <div class="chart-header">
            <h3 class="chart-title">💻 工具開發語言占比</h3>
            <span class="chart-subtitle">Language Breakdown</span>
          </div>
          <div class="chart-wrapper">
            <canvas id="languageChart"></canvas>
          </div>
        </div>
      </div>

      <!-- 各分類概覽條目面板 -->
      <div class="section-title-bar">
        <h2>🗂️ 分類條目與數據概覽</h2>
      </div>
      <div id="categoryOverviewGrid" class="category-overview-grid">
        <!-- 分類卡片將由 JS 動態生成 -->
      </div>
    </div>

    <!-- 工具目錄視圖 (Tools List View) -->
    <div id="toolsView" style="display: none;">
      <div class="search-container glass-panel" style="margin: 0 auto calc(var(--spacing-base) * 6) auto;">
        <input type="text" id="searchInput" placeholder="搜尋工具名稱、ID、關鍵詞或觸發詞 (例如: ppt-master, security, video)..." autocomplete="off">
        <select id="categorySelect">
          <option value="">所有分類</option>
        </select>
      </div>

      <div class="stats-bar">
        <span id="resultCount">載入中...</span>
        <button id="expandAllBtn" class="expand-all-btn">收合全部</button>
      </div>

      <div id="resultsGrid" class="results-container">
        <!-- 搜尋結果將由 JS 動態渲染在這裡 -->
      </div>
    </div>
  </main>

  <template id="toolCardTemplate">
    <article class="tool-card glass-panel">
      <div class="card-header">
        <h2 class="tool-name"></h2>
        <span class="match-badge"></span>
      </div>
      <p class="tool-desc"></p>
      <div class="tags-container">
        <!-- 標籤動態插入 -->
      </div>
      <div class="card-footer">
        <span class="category-tag"></span>
        <a class="github-link" href="#" target="_blank" rel="noopener noreferrer">
          <svg viewBox="0 0 24 24" width="16" height="16" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M9 19c-5 1.5-5-2.5-7-3m14 6v-3.87a3.37 3.37 0 0 0-.94-2.61c3.14-.35 6.44-1.54 6.44-7A5.44 5.44 0 0 0 20 4.77 5.07 5.07 0 0 0 19.91 1S18.73.65 16 2.48a13.38 13.38 0 0 0-7 0C6.27.65 5.09 1 5.09 1A5.07 5.07 0 0 0 5 4.77a5.44 5.44 0 0 0-1.5 3.78c0 5.42 3.3 6.61 6.44 7A3.37 3.37 0 0 0 9 18.13V22"></path></svg>
          View Source
        </a>
      </div>
      <div class="progress-bar-container">
        <div class="progress-bar"></div>
      </div>
    </article>
  </template>

  <script type="module" src="app.js"></script>
</body>
</html>
