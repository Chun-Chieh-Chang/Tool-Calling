<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <linearGradient id="wrench-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#3B82F6"/>
    </linearGradient>
    <linearGradient id="bolt-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FBBF24"/>
      <stop offset="100%" stop-color="#F59E0B"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Container Background -->
  <rect x="2" y="2" width="60" height="60" rx="14" fill="url(#bg-grad)" stroke="#334155" stroke-width="1.5"/>

  <!-- Wrench Icon -->
  <path d="M 22.5 41.5 L 36.5 27.5 M 34.5 25.5 C 33.2 23.8 33.4 21.3 35.0 19.7 C 36.7 18.0 39.3 18.0 40.9 19.6 L 38.3 22.2 L 41.8 25.7 L 44.4 23.1 C 46.0 24.7 46.0 27.3 44.3 29.0 C 42.7 30.6 40.2 30.8 38.5 29.5 L 24.5 43.5 C 23.4 44.6 21.6 44.6 20.5 43.5 L 20.5 43.5 C 19.4 42.4 19.4 40.6 20.5 39.5 Z" 
        fill="none" 
        stroke="url(#wrench-grad)" 
        stroke-width="3.5" 
        stroke-linecap="round" 
        stroke-linejoin="round"
        filter="url(#glow)"/>

  <!-- Lightning Bolt -->
  <polygon points="39,14 27,31 34,31 25,48 41,29 33,29" 
           fill="url(#bolt-grad)" 
           filter="url(#glow)"/>
</svg>
